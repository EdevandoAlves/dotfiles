# GTK 4.20+ no Wayland deixou de compor dead keys / sequências de compose por
# conta própria: passou a exigir um input method via text-input-v3. O Hyprland
# não implementa esse protocolo, então apps GTK (Ghostty, Nautilus, ...) ficam
# sem acentos mortos. "simple" devolve o compose nativo do GTK.
# Se um dia precisar de IME (japonês, chinês, coreano), troque por "fcitx".
GTK_IM_MODULE=simple
