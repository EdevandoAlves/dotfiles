$bg        = rgba(1a1b26ee)
$surface   = rgba(24283bcc)
$fg        = rgb(c0caf5)
$muted     = rgb(565f89)
$blue      = rgb(7aa2f7)
$cyan      = rgb(7dcfff)
$purple    = rgb(bb9af7)
$red       = rgb(f7768e)

general {
    ignore_empty_input = true
    grace = 0
}

background {
    monitor =
    path = ~/Pictures/Wallpapers/a_street_lights_at_night_01.jpg
    color = $bg
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H')"
    color = $fg
    font_size = 108
    font_family = JetBrainsMono Nerd Font ExtraBold
    position = 160, 260
    halign = left
    valign = center
    shadow_passes = 3
    shadow_size = 6
    shadow_color = rgba(0, 0, 0, 0.5)
}


label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%M')"
    color = $muted
    font_size = 108
    font_family = JetBrainsMono Nerd Font Bold
    position = 200, 140
    halign = left
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %d %B, %Y')"
    color = $muted
    font_size = 17
    font_family = JetBrainsMono Nerd Font
    position = 80, 60
    halign = left
    valign = center
}

label {
    monitor =
    text = Welcome, $USER
    color = $fg
    font_size = 16
    font_family = JetBrainsMono Nerd Font Medium
    position = 170, -70
    halign = left
    valign = center
}

input-field {
    monitor =
    size = 300, 48
    outline_thickness = 2
    dots_size = 0.28
    dots_spacing = 0.35
    dots_center = true
    dots_rounding = -1
    rounding = 14
    outer_color = $blue
    inner_color = $surface
    font_color = $fg
    check_color = $cyan
    fail_color = $red
    capslock_color = $purple
    fade_on_empty = false
    placeholder_text =
    fail_text = <span foreground="##f7768e">  $ATTEMPTS</span>
    hide_input = false
    position = 100, -130
    halign = left
    valign = center
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.4)
}

label {
    monitor =
    text = 
    color = $muted
    font_size = 30
    onclick = reboot now
    position = 160, 300
    halign = left
    valign = bottom
}

label {
    monitor =
    text = 
    color = $muted
    font_size = 35
    onclick = shutdown now
    position = 233, 310
    halign = left 
    valign = bottom
}

label {
    monitor =
    text =  󰽧    
    color = $muted
    font_size = 30
    onclick = systemctl suspend
    position = 310, 295
    halign = left
    valign = bottom
}
